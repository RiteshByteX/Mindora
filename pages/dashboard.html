<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mindora · Dashboard</title>

    <!-- ===== FAVICONS ===== -->
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/logo1.png" />

    <!-- ===== FONTS & ICONS ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- ===== STYLES ===== -->
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body>

    <!-- ===== PRELOADER ===== -->
    <div class="preloader">
        <div class="loader-ring"></div>
        <div class="loader-text">Loading...</div>
    </div>

    <!-- ===== BACKGROUND ===== -->
    <div class="bg-layer-1"></div>
    <div class="bg-layer-2"></div>

    <!-- ===== HEADER ===== -->
    <header class="dashboard-header glass-nav">
        <div class="header-container">
            <a href="../index.html" class="logo-wrapper">
                <img src="../assets/logo1.png" alt="Mindora" class="brand-logo-img" />
                <span class="brand-logo-text">Mindora</span>
            </a>
            <nav class="header-nav">
                <a href="../index.html" class="nav-link">
                    <i class="fas fa-home"></i> Home
                </a>
                <a href="#" class="nav-link active">
                    <i class="fas fa-th-large"></i> Dashboard
                </a>
            </nav>
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="dashboard-main">
        <div class="container">
            <!-- Page Title -->
            <div class="page-header">
                <h1>📚 Choose Your <span class="gradient-text">Subject</span></h1>
                <p>Select a subject below to start learning. All lessons are free and accessible.</p>
            </div>

            <!-- Subject Grid -->
            <div class="subject-grid" id="subjectGrid">
                <!-- Subjects will be loaded by JavaScript -->
            </div>
        </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="dashboard-footer">
        <div class="container">
            <p>&copy; 2026 Mindora. Made with <i class="fas fa-heart" style="color: var(--neon-pink);"></i> for learners.</p>
        </div>
    </footer>

    <!-- ===== JAVASCRIPT ===== -->
    <script src="../js/dashboard.js"></script>
</body>
</html>
